databases:
  - name: company-rag-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: company-rag
    runtime: node
    plan: free
    # NODE_ENV=production must NOT be set as a build-time env var here: it
    # makes `npm install` skip devDependencies (typescript, tsx, ...), which
    # both `next build` and the db:migrate:prod start step need. Render sets
    # its own build-vs-runtime NODE_ENV correctly without this.
    buildCommand: npm install && npm run build
    # Migration is idempotent (CREATE TABLE/EXTENSION IF NOT EXISTS) so it's
    # safe to run on every start, which is the only reliable "run this once
    # after deploy" hook available without shell access on the free plan.
    startCommand: npm run db:migrate:prod && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-rag-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNTS_BASE_URL
        sync: false
      - key: ZOHO_API_BASE_URL
        sync: false
      - key: ZOHO_BOOKS_ORGANIZATION_ID
        sync: false
      - key: CRM_SYNC_SECRET
        sync: false
      # Optional — Redis-backed rate limiting shared across instances. Falls
      # back to an in-memory limiter if left unset.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional — Sentry error tracking. Errors just go to console logs if unset.
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # Optional — scheduled email digest (POST /api/digest/email). Declines
      # to send rather than erroring if left unset.
      - key: RESEND_API_KEY
        sync: false
      - key: DIGEST_EMAIL_TO
        sync: false
      - key: DIGEST_EMAIL_FROM
        sync: false
      - key: DIGEST_EMAIL_SECRET
        sync: false
